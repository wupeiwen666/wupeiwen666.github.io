<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江西师专导小助</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    height:100vh; display:flex; flex-direction:column;
    background:linear-gradient(160deg,#0f7a5c 0%,#0b5c46 45%,#093f31 100%);
    color:#fff; overflow:hidden;
  }
  header {
    padding:16px 20px; display:flex; align-items:center; gap:14px;
    background:rgba(0,0,0,.22); backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(255,255,255,.12);
  }
  .avatar {
    width:52px; height:52px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 30% 30%,#7be8c4,#17a673);
    display:flex; align-items:center; justify-content:center;
    font-size:28px; box-shadow:0 0 0 3px rgba(255,255,255,.25);
    animation:breathe 3s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
  .title h1 { font-size:19px; letter-spacing:1px; }
  .title p { font-size:12px; opacity:.75; margin-top:3px; }
  .badge {
    margin-left:auto; font-size:11px; padding:4px 10px; border-radius:20px;
    background:rgba(46,204,113,.2); border:1px solid rgba(46,204,113,.6);
  }
  #chat {
    flex:1; overflow-y:auto; padding:20px 16px;
    display:flex; flex-direction:column; gap:14px;
  }
  .msg { display:flex; gap:10px; max-width:88%; animation:pop .25s ease; }
  @keyframes pop { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
  .msg.bot { align-self:flex-start; }
  .msg.user { align-self:flex-end; flex-direction:row-reverse; }
  .msg .bub {
    padding:12px 15px; border-radius:16px; font-size:15px; line-height:1.65;
    white-space:pre-wrap; word-break:break-word;
  }
  .msg.bot .bub { background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.18); border-top-left-radius:4px; }
  .msg.user .bub { background:#1abc7a; color:#06281d; font-weight:500; border-top-right-radius:4px; }
  .msg .mini {
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .msg.bot .mini { background:radial-gradient(circle at 30% 30%,#7be8c4,#17a673); }
  .msg.user .mini { background:rgba(255,255,255,.2); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; padding:4px 16px 10px; }
  .chip {
    font-size:12.5px; padding:7px 13px; border-radius:20px; cursor:pointer;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25);
    transition:.2s; user-select:none;
  }
  .chip:hover { background:rgba(255,255,255,.28); transform:translateY(-1px); }
  footer {
    display:flex; gap:10px; padding:12px 16px 18px;
    background:rgba(0,0,0,.25); backdrop-filter:blur(6px);
  }
  #input {
    flex:1; padding:13px 16px; border-radius:26px; border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.1); color:#fff; font-size:15px; outline:none;
  }
  #input::placeholder { color:rgba(255,255,255,.5); }
  #input:focus { border-color:#2ee6a8; background:rgba(255,255,255,.16); }
  #send {
    width:50px; height:50px; border-radius:50%; border:none; cursor:pointer; font-size:20px;
    background:linear-gradient(135deg,#2ee6a8,#12b886); color:#06281d;
    box-shadow:0 4px 14px rgba(46,230,168,.45); transition:.15s;
  }
  #send:hover { transform:scale(1.08); }
  #send:active { transform:scale(.95); }
  .typing i {
    display:inline-block; width:7px; height:7px; margin:0 2px; border-radius:50%;
    background:#7be8c4; animation:blink 1.2s infinite;
  }
  .typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink { 0%,60%,100%{opacity:.25} 30%{opacity:1} }
  #chat::-webkit-scrollbar { width:5px; }
  #chat::-webkit-scrollbar-thumb { background:rgba(255,255,255,.25); border-radius:3px; }
</style>
</head>
<body>

<header>
  <div class="avatar">🎓</div>
  <div class="title">
    <h1>江西师专导小助</h1>
    <p>江西师范高等专科学校 · AI校园助手（免登录，直接聊）</p>
  </div>
  <div class="badge">● 在线</div>
</header>

<div id="chat"></div>

<div class="chips" id="chips"></div>

<footer>
  <input id="input" placeholder="想聊点什么？比如：学校在哪 / 有哪些专业 / 宿舍怎么样" autocomplete="off">
  <button id="send" title="发送">➤</button>
</footer>

<script>
const KNOWLEDGE = [
  {k:["你好","您好","hi","hello","嗨","在吗","在么"], a:"你好呀！我是导小助🎓，江西师专的智能体助手～想了解学校简介、专业设置、录取分数、宿舍食堂、社团活动等，随便问！ 😊"},
  {k:["简介","介绍","概况","学校是谁","关于学校","什么样"], a:"🏫 江西师范高等专科学校（简称“江西师专”）是一所全日制公办师范类高等专科学校，坐落于江西省鹰潭市。学校以师范教育为特色，同时开设文、理、工、管、艺术等多学科专业，致力于培养高素质的基础教育师资和应用型人才。"},
  {k:["在哪","地址","位置","鹰潭","怎么来","路线","交通"], a:"📍 学校位于江西省鹰潭市。鹰潭是沪昆高铁、鹰厦铁路的重要枢纽，交通非常便利：\n• 高铁：鹰潭北站下车，打车约10分钟即达\n• 火车：鹰潭站下车也很近\n• 市内：多路公交直达校门口"},
  {k:["专业","招生专业","有哪些系","院系","学科"], a:"📚 学校设有多个教学院系，主要专业包括：\n• 师范类：学前教育、小学教育、语文教育、数学教育、英语教育等\n• 非师范类：计算机应用、电子商务、会计、艺术设计、旅游管理等\n具体招生专业以当年《招生简章》为准哦～"},
  {k:["学前教育","小学教育","教育"], a:"🧸 学前教育是江西师专的王牌师范专业之一，培养幼儿园及学前教育机构教师，课程涵盖幼儿心理、活动设计、钢琴、舞蹈、绘画等；小学教育方向则培养小学各学科教师，注重教学技能与班级管理实训，还有稳定的实习基地。"},
  {k:["分数","录取","分数线","高考","报志愿","多少分","招生计划"], a:"📈 录取分数线每年不同、各省不同。一般来说，专科批次达到本省专科线即有机会录取，热门师范专业分数会略高。\n👉 建议查询：学校招生信息网或拨打招生办电话，查看最新分省分专业录取数据。"},
  {k:["宿舍","住宿","寝室","公寓"], a:"🛏️ 学生宿舍一般为标准4-6人间，配有独立卫生间、空调、热水、网络等，部分楼栋带阳台。宿舍区紧邻食堂和教学楼，生活很方便。新生由学校统一安排床位。"},
  {k:["食堂","吃饭","美食","伙食"], a:"🍜 学校食堂菜品丰富、价格实惠，南北风味都有：盖浇饭、粉面、麻辣烫、小炒等一应俱全。周边还有小吃街，螺蛳粉、烧烤、奶茶随便挑，干饭人狂喜～"},
  {k:["学费","收费","多少钱","费用","住宿费"], a:"💰 作为公办专科院校，学费按江西省统一标准收取，一般每年4000-5000元左右（艺术类专业略高），住宿费约800-1000元/年。师范类还有各类奖助学金可以申请！"},
  {k:["奖学金","助学金","贫困","资助"], a:"🎁 学校资助体系完善：国家奖学金（8000元/年）、国家励志奖学金（5000元/年）、国家助学金（2000-4000元/年）、校级奖学金、勤工助学岗位、生源地助学贷款等，帮你安心完成学业。"},
  {k:["社团","活动","学生会","课余"], a:"🎨 校园生活超精彩！有文学社、书法社、舞蹈队、合唱团、篮球/足球/羽毛球协会、青年志愿者协会、新媒体中心等几十个社团，迎新晚会、运动会、师范生技能大赛常年不断。"},
  {k:["就业","毕业","前景","找工作","升本","专升本"], a:"🚀 两个发展方向：\n• 就业：师范专业可考教师编制、应聘幼儿园和中小学；非师范专业也有校企合作推荐就业，就业率常年保持较高水平。\n• 升本：可参加江西省统招专升本，升入本科院校继续深造，学校有专门的升本辅导。"},
  {k:["校园","环境","风景","面积","设施"], a:"🌳 校园环境优美、绿树成荫，教学楼、图书馆、实训楼、标准化操场、室内体育馆一应俱全。师范类专业还有琴房、舞蹈房、微格教室等实训设施，学习氛围浓厚。"},
  {k:["图书馆","自习","借书"], a:"📖 学校图书馆藏书丰富，阅览室宽敞明亮，有空调和大量自习座位，考试周一座难求～凭校园卡即可借阅图书。"},
  {k:["军训","开学","报到","新生"], a:"🎒 新生开学一般在9月初，报到后会安排军训（约两周）。记得带好录取通知书、身份证、档案、一寸照片哦。开学期间车站会有迎新志愿者接站，不用担心迷路～"},
  {k:["联系方式","电话","招生办","网址","官网"], a:"📞 更多信息可以访问学校官方网站或招生信息网查询。\n温馨提示：以官网公布为准，谨防招生诈骗电话！"},
  {k:["专升本","升学","继续读书"], a:"📚 江西师专学生可参加江西省统一组织的统招专升本考试，升入对口本科院校学习2年，毕业后拿全日制本科文凭。学校一般会在大三组织复习辅导，早做准备机会更大！"},
  {k:["男生","女生","男女比例"], a:"😄 师范类院校普遍女生多一些，男女比例大致3:7左右（因专业而异），学前教育专业男生更是“国宝级”存在～"},
  {k:["气候","天气","冬天","夏天"], a:"☀️ 鹰潭属亚热带季风气候，四季分明：夏季较热多雨，冬季湿冷无暖气（靠一身正气），春秋最舒服。建议新生备齐夏装和厚外套。"},
  {k:["快递","网购","寄东西","驿站"], a:"📦 校内或校门口设有快递驿站（菜鸟驿站等），三通一达、顺丰、京东均可到达，取件很方便，剁手党放心买买买！"},
  {k:["附近","周边","玩","景点","龙虎山"], a:"🗺️ 鹰潭最出名的就是世界自然遗产「龙虎山」（道教祖庭、丹霞地貌），坐公交或打车约半小时可达，学生票有优惠。市区还有滨江公园、北极阁等休闲好去处。"},
  {k:["老师","师资","教授","水平"], a:"👨‍🏫 学校拥有一支结构合理的师资队伍，包括教授、副教授及双师型教师，不少教师有基础教育一线教学经验，师范生培养很有保障。"},
  {k:["谢谢","感谢","thx","thanks"], a:"不客气～😄 有问题随时找我，祝你在江西师专度过充实快乐的时光！ 🦌"},
  {k:["再见","拜拜","bye","晚安"], a:"再见啦！有任何关于江西师专的问题，我随时都在～ 🌙"},
  {k:["你是谁","名字","叫什么","机器人","智能体"], a:"我是导小助🎓，专为江西师范高等专科学校打造的AI智能体～我可以回答关于学校简介、专业、录取、宿舍食堂、社团活动等常见问题，免登录直接聊，试试吧！"},
];


// ===== 心理危机安全层（优先级最高） =====
const SAFETY = [
  {k:["不想活","想死","自杀","轻生","活不下去","不想活了","死了一了百了","想不开","了结","结束生命"],
   a:"听到你说这些，我真的很担心你 💛\n\n现在的痛苦一定很重吧，但请先给自己一个机会——痛苦不会永远持续，而你值得被帮助。\n\n你可以：\n• 拨打全国心理援助热线：12356（24小时，免费）\n• 紧急情况请拨打 110 或 120\n• 联系学校心理咨询中心，老师会为严格保密\n• 马上告诉你信任的人：家人、朋友、辅导员，让他们陪着你\n\n愿意的话，可以继续和我说说发生了什么，我会一直在这里 🫂"},
  {k:["自残","伤害自己","割腕","跳楼","烧自己","打自己"],
   a:"请先停下来，深呼吸一下 💛\n\n伤害自己并不能解决痛苦，你不需要一个人扛着。\n\n请立刻联系：\n• 全国心理援助热线：12356\n• 紧急求助：110 / 120\n• 学校心理咨询中心或辅导员\n\n你很重要，真的。我愿意听你说 🫂"},
  {k:["抑郁","焦虑","失眠","压力大","好难过","想哭","崩溃","绝望","孤独","活着没意思","好痛苦","撑不住"],
   a:"抱抱你 🫂 谢谢你愿意把感受说出来，这本身就很勇敢。\n\n持续的情绪低落值得被认真对待，建议：\n• 拨打全国心理援助热线 12356（24小时免费）\n• 预约学校心理咨询中心，和专业老师聊聊\n• 也可以先和信任的朋友、家人、辅导员倾诉\n\n如果这种感觉已经持续两周以上，请务必告诉身边的人。你不是一个人 💛"},
];

const FALLBACK = [
  "这个问题我还在学习中～🤔 你可以换个问法，比如「宿舍条件」「录取分数线」「有哪些专业」？",
  "这个我还不太确定，怕说错话误导你 🙈 建议问问辅导员或查看学校官网～也可以问我：食堂、社团、专升本！",
  "暂时没get到你的意思 😅 试试点击下方的问题，或者问我关于学习、生活、招生的内容？",
];

const chat = document.getElementById('chat');
const input = document.getElementById('input');
const chipsBox = document.getElementById('chips');
let fallbackIdx = 0;

const CHIPS = ["学校简介","有哪些专业","录取分数线","宿舍怎么样","食堂好吃吗","能专升本吗","周边有什么玩的"];
CHIPS.forEach(c => {
  const d = document.createElement('div');
  d.className = 'chip'; d.textContent = c;
  d.onclick = () => { input.value = c; send(); };
  chipsBox.appendChild(d);
});

function addMsg(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.innerHTML = `<div class="mini">${who==='bot'?'🎓':'🙂'}</div><div class="bub"></div>`;
  div.querySelector('.bub').textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function botReply(userText) {
  const typing = addMsg('', 'bot');
  typing.querySelector('.bub').classList.add('typing');
  typing.querySelector('.bub').innerHTML = '<i></i><i></i><i></i>';
  setTimeout(() => {
    const q = userText.toLowerCase();
    let ans = null;
    for (const item of SAFETY) {
      if (item.k.some(k => q.includes(k))) { ans = item.a; break; }
    }
    if (!ans) for (const item of KNOWLEDGE) {
      if (item.k.some(k => q.includes(k))) { ans = item.a; break; }
    }
    if (!ans) { ans = FALLBACK[fallbackIdx++ % FALLBACK.length]; }
    typing.querySelector('.bub').innerHTML = '';
    // 打字机效果
    let i = 0;
    const timer = setInterval(() => {
      typing.querySelector('.bub').textContent = ans.slice(0, ++i);
      chat.scrollTop = chat.scrollHeight;
      if (i >= ans.length) clearInterval(timer);
    }, 14);
  }, 500 + Math.random()*500);
}

function send() {
  const t = input.value.trim();
  if (!t) return;
  addMsg(t, 'user');
  input.value = '';
  botReply(t);
}

document.getElementById('send').onclick = send;
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// 开场白
setTimeout(() => {
  addMsg("哈喽！我是导小助🎓，江西师专智能体～\n我了解这所学校的专业、录取、宿舍、食堂、社团等各种信息，点击下方问题或直接输入，免登录直接聊！", 'bot');
}, 400);
</script>
</body>
</html>

const KNOWLEDGE = [{"k": ["学校简介", "介绍一下学校", "学校怎么样", "学校情况", "学校多大", "学校什么性质"], "a": "江西师范高等专科学校是江西省人民政府批准、教育部备案的全日制公办专科院校，2015年在江西师大鹰潭学院基础上成立，位于鹰潭市（交通枢纽、世界铜都、中华道都）。\n占地1250亩，在校生10000余人，教职工500余人，硕士以上教师约62%。\n现有铜业制造、人工智能、康养、音乐舞蹈、非遗文旅5个学院（书院），29个招生专业，学前教育、物联网、眼视光3个省级高水平专业群，与俄罗斯、韩国高校有合作办学项目。"}, {"k": ["什么时候开学", "开学时间", "报到时间", "老生报到", "新生报到", "几号开学", "返校"], "a": "2026-2027学年第一学期：\n• 老生报到：9月5日-6日，9月7日正式上课\n• 新生报到：9月7日-8日\n• 新生入学教育：9月9日-10日\n• 新生军训：9月11日-24日（14天）\n• 新生正式上课：9月28日\n\n第二学期：2月20-21日报到，2月22日上课，7月1日领毕业证。"}, {"k": ["运动会"], "a": "2026-2027学年第一学期运动会时间为10月26日，具体安排以学校正式通知为准。"}, {"k": ["期末", "考试时间", "什么时候考试"], "a": "期末考查和考试：第一学期在第19周，第二学期在第17周。具体日程以教务处通知为准，建议提前两周复习。"}, {"k": ["作息时间", "几点起床", "几点熄灯", "几点上课", "时间安排"], "a": "夏季作息（5月1日-9月30日）：\n• 起床6:30，早自习7:10-7:40\n• 上午8:00-11:40（4节课）\n• 下午14:40-18:20（4节课）\n• 晚自习19:30-21:30\n• 教室22:00关门，寝室23:00熄灯\n10月1日起可能切换冬季作息，以教务处通知为准。"}, {"k": ["书院", "书院制", "有哪些学院", "明德书院", "双院", "学院有哪些", "学院调整"], "a": "学校实行书院+学院双院协同育人，5个学院各对应1个书院：\n• 铜业制造学院（求真书院）\n• 人工智能学院（知行书院）\n• 康养学院（培元书院）\n• 音乐舞蹈学院（明德书院）← 咱们院\n• 非遗文旅学院（致远书院）\n\n学院管专业教学，书院管日常管理和思政，你两边都要对接。明德书院有12位辅导员。咨询电话0701-6317153。"}, {"k": ["新生报到带什么", "报到材料", "报到指南", "新生要带"], "a": "新生报到材料清单：\n1. 身份证\n2. 报到单（迎新系统打印）\n3. 录取通知书\n4. 考生个人纸质档案（别私拆！拆了要回档案地重新封）\n5. 党团组织关系材料\n6. 一寸免冠照8张\n7. 申请困难认定的带：户口本复印件（户主页+本人页）、贫困证明复印件\n\n床铺0.9米×2米、上铺下桌。禁带大功率电器、易燃易爆品。缴费只认官方渠道，任何个人转账都是诈骗！"}, {"k": ["迎新系统", "网上报到", "网上操作", "ehall", "迎新网"], "a": "新生网上报到流程：\n1. 登录智慧校园网上服务大厅 http://ehall.jxsfgz.com（8月30日开放），账号：身份证号，初始密码：身份证后6位（X大写）\n2. 搜\"迎新服务\"→完善信息（红色必填）\n3. 办贷款的走\"绿色通道\"上传回执\n4. 财务缴费（一律线上，不收现金）\n5. 缴费后半小时自动分宿舍，在\"新生报到\"里查\n6. 填到站统计，获取最优路线\n7. 完成后打印报到单\n\n手机端：今日校园APP→学工号登录。"}, {"k": ["今日校园", "办事大厅", "网上办事", "一卡通", "怎么登录"], "a": "一站式办事大厅使用：\n• 电脑端：ehall.jxsfgz.com（或学校官网左下\"公共服务\"）\n• 手机端：今日校园APP→学工号登录→选学校\n• 账号：学号，初始密码：身份证后6位（X大写）\n\n常用应用（今日校园搜索）：一卡通查账充值、宿舍购电、后勤报修、学生请假、课表查询（电脑端正方教务系统）、学生证补办、勤工助学、解忧直通车。首次登录记得改密码，忘了找辅导员或网络中心0701-6461665。"}, {"k": ["办公室", "a305", "在哪找你", "什么时候在", "找不到你"], "a": "我办公室在一站式服务大厅A305。\n办公时间：周一至周五 8:30-12:00，14:30-17:30。\n不在的话可能在上课、开会或查寝，先微信或电话联系我：18070177202。\n学院办公室在艺术中心2楼；资助管理中心在一站式B区318室（苏静老师18907017961）。"}, {"k": ["挂科", "补考"], "a": "别着急，挂科有补考机会：\n1. 时间：一般开学后第2-3周，以教务办通知为准\n2. 报名：教务系统\"补考报名\"，截止一般是开学第1周周五\n3. 补考不过要重修（第8-10周报名）\n4. 注意：补考成绩最高记60分\n\n具体可联系教务办，或来A305找我。"}, {"k": ["重修"], "a": "重修报名在每学期第8-10周，登录教务系统→学生选课→重修报名。可跟班重修或自学重修，考试跟期末一起。重修成绩按实际分数记录，不限最高分。"}, {"k": ["选课", "退课", "选错"], "a": "选课/退课窗口是每学期开学第1-2周，逾期一般不给办。\n操作：教务系统→学生选课→已选课程→退课。\n注意：必修课不能退；退课后学分不够影响毕业；超期特殊情况要书面申请经学院和教务处审批。"}, {"k": ["体育选修", "体育课怎么选"], "a": "体育兴趣选修课只在第一周选，本学期为9月8日10:30-9月10日18:00，错过等一学期！\n流程：教务系统→选课→自主选课→查询→选课→确认成功。窗口期内可退。疑问找康养学院体育教研室或来A305找我。"}, {"k": ["转专业", "换专业", "专业不满意"], "a": "可以申请，基本条件：\n1. 时间：大一下学期（以教务处通知为准）\n2. 成绩：第一学期全部及格且优良\n3. 名额：转出人数≤本专业总人数10%\n\n流程：填《转专业申请表》→辅导员签字→转出学院院长签字盖章→招生就业处审核→转入学院审核→教务处审批。\n\n注意：有不得转专业情形（详见管理办法）；转后要补修新课程，可能影响毕业时间。先找我聊聊利弊再决定，表格来A305领。"}, {"k": ["休学"], "a": "休学条件：1.因病（二甲以上医院诊断建议）2.参军入伍（凭入伍通知书）3.创业（经创业指导部门审核）4.其他特殊原因。流程：填表+证明材料→家长签字（未成年必须）→学院审核→教务处审批→办离校。一般休一年，期满前一个月申请复学。详情来A305。"}, {"k": ["学前教育本科", "专升本学分", "修多少学分"], "a": "学前教育（专升本，2-5年弹性学制）要求：\n• 至少修满72学分\n• 达到要求授教育学学士学位（与南昌师范学院联合）\n• 学位课程9门：教育学原理、普通心理学、学前教育学、学前心理学、中外学前教育史、学前儿童保育学、幼儿园组织与管理、学前儿童游戏、幼儿园课程\n• 教育实习：第3学期前9周；毕业论文：第4学期\n• 普通话要求二级乙等及以上\n\n专科层次学分要求不同，看本专业培养方案。"}, {"k": ["最长学习年限", "留级", "什么情况退学", "学习年限"], "a": "学籍红线，记好：\n• 最长修业年限：普通5年，创业休学可延至6年\n• 留级：每学年必修课补考超5门（含）或补考不及格超3门（含）\n• 退学情形：毕业前补考仍不及格达6门；超年限未完成学业；休学期满不复学；连续两周未经批准不参加活动；逾期未注册。\n\n感觉跟不上尽早来找我，别拖到留级退学。"}, {"k": ["毕业", "结业", "肄业", "毕业证"], "a": "区别在于：\n• 毕业：修完教学计划、全部合格、德育体育达标→发毕业证\n• 结业：修完但未达毕业要求（实习不及格、毕业学年课程不合格、历年补考仍不及格、英语计算机未达标等）→发结业证；结业后次年5月可申请补考，合格换毕业证\n• 肄业：退学但学习满一年→发写实性学习证明\n\n有挂科的同学抓紧补考，别拖到结业。"}, {"k": ["毕业学分", "要修多少学分"], "a": "毕业学分因专业而异：专升本至少72学分，专科一般130-150学分（看本专业培养方案）。\n框架：公共必修课+专业必修课+选修课+实践教学+第二课堂。\n要求：必修课全及格、选修够学分、论文/设计通过、第二课堂达标。\n在教务系统查自己的学分完成情况，有缺口尽早补。"}, {"k": ["四六级", "英语四级", "六级"], "a": "四六级笔试每年6月、12月各一次；3月考3月中下旬报名，12月考9月中下旬报名。报名：cet.neea.edu.cn或教务系统，考前一周打印准考证。以教务处当年通知为准。"}, {"k": ["普通话", "测试站"], "a": "普通话测试：每年3月、9月报名（语委办通知为准）。在线报名系统或学校统一组织，测试站在校内五楼（靠近南门方向）。\n流程：候测室采集照片题号→备考室候考→机房测试。\n打印准考证：bm.cltt.org（省份选江西）；成绩约60个工作日后cltt.org查询，证书2-3个月后发。\n师范类需二级乙等以上，语文方向二级甲等，音舞专业也建议尽早考。"}, {"k": ["资助时间", "时间节点", "什么时候交材料", "资助安排"], "a": "本学期资助关键节点（错过可能等一年！）：\n• 9月15日11:00前：助学贷款回执单交资助办盖章、贷款汇总表发邮箱\n• 9月23日前：应征入伍学费补偿+退役士兵学费减免材料\n• 困难认定：书院审核9月7-13日（含5天公示），学校审核9月14-18日\n\n资助中心：一站式B区318室，苏静老师18907017961，邮箱jxszxgczz@163.com。"}, {"k": ["国家奖学金", "国奖"], "a": "国家奖学金8000元/年，最高荣誉：\n• 条件：成绩排名专业前10%、无不及格、综测突出\n• 评分：学习成绩50分+综合素质展演10分+政治思想5分+嘉奖表彰5分+创新能力15分+社会实践5分+论文专利5分+学生职务5分\n• 加分项：四级+2分、计算机二级+2分，竞赛获奖按级别加分\n• 9-10月评审，与国家励志奖学金不可兼得\n\n评审结果以正式公示为准，有疑问来A305找我。"}, {"k": ["国家励志奖学金", "励志"], "a": "励志奖学金5000元/年：\n• 前提：必须先完成家庭经济困难认定\n• 成绩排名专业前30%、无不及格、无违纪\n• 9-10月通过辅导员提交申请，学院评审公示\n• 不能与国家奖学金同时获得\n\n结果以公示为准，先来A305找我确认认定状态。"}, {"k": ["国家助学金", "助学金档次", "助学金多少钱"], "a": "国家助学金分三档（按困难认定结果定档）：\n• 特别困难：4400元/年（每月440×10个月）\n• 困难：3300元/年\n• 一般困难：2200元/年\n\n一般10月至次年6月按月发到银行卡。认定期间违纪可能被取消资格。具体金额以当年省文件为准。"}, {"k": ["生源地贷款", "助学贷款"], "a": "生源地信用助学贷款：\n• 时间：每年7-9月，回户籍地县（市、区）教育局资助中心办理\n• 额度：本专科每年最高16000元\n• 材料：身份证、户口本、录取通知书（新生）/学生证（在校生）、共同借款人身份证\n• 续贷：第二年起可网上办，不用跑现场\n• 还款：毕业后5年还本宽限期，只还利息\n• 学校端：贷款回执单9月15日11:00前交书院汇总\n\n详情找户籍地资助中心，或来A305找我。"}, {"k": ["困难认定", "家庭经济困难", "贫困认定"], "a": "困难认定时间：书院审核9月7-13日（系统同步开放），学校审核9月14-18日，含5个工作日公示。\n\n系统申请：ehall.jxsfgz.com（或今日校园搜\"困难生\"）→申请→完善5个模块信息→上传佐证材料（清晰完整，5MB内）→提交。\n\n填写要点：\n• 家庭成员都要填（无收入填0）\n• 困难类型只能选一种\n• 人口数、人均年收入、月收入要吻合\n• 申请理由不少于200字，别写\"尊敬的校领导\"这类称呼\n• 佐证材料必须传！\n\n14类特殊群体（脱贫、低保、残疾、孤儿等）勾选对应类型。认定是助学金、励志奖学金、勤工助学的前提。"}, {"k": ["退役士兵", "学费减免", "退伍军人"], "a": "退役士兵学费减免：\n• 对象：入伍前在读、退役后复学；或退役后自主就业考入我校的新生\n• 2026年9月退役复学：全国征兵网下载申请表II→县级征兵办盖章→连同退役证复印件交资助中心（B区318）\n• 更早退役的：填学校减免申请表+退伍证、身份证、学生证复印件\n• ⏰ 截止9月23日，之后无法减免！\n\n符合条件的抓紧办，先来A305找我。"}, {"k": ["入伍", "当兵", "参军", "征兵", "学费补偿"], "a": "应征入伍学费补偿：\n• 材料：申请表I（财务签章版）+入伍通知书+身份证复印件\n• 电子表：\"XX书院-2026年入伍学费补偿统计表\"发 jxszxgczz@163.com\n• ⏰ 9月23日前交学工处资助办（B区318），过时只能等明年\n• 以书院为单位统一提交，个人先把材料交给我\n\n入伍还享受保留学籍至退役后2年，欢迎来A305细谈。"}, {"k": ["勤工助学", "勤工俭学"], "a": "勤工助学：\n• 岗位：每学期开学2周内发布，图书馆、行政办公室、辅导员助理等\n• 条件：须已认定家庭经济困难\n• 报名：资助管理系统或向辅导员报名\n• 报酬：15-20元/小时，每月不超40小时，按月发卡\n\n岗位有限，特困优先。关注班级群通知，或来A305咨询。"}, {"k": ["临时困难补助", "突发困难"], "a": "家庭突发变故可以申请临时困难补助：\n• 适用：重大灾害事故、家人重病、本人突发重病等\n• 金额：一般500-3000元，特别困难可提高\n• 流程：书面申请+证明材料→学院审核→学工处→学校审批\n• 审批约3-5个工作日\n• 一学年一般不超过两次\n\n遇到困难别硬扛，随时来A305找我。"}, {"k": ["请假", "销假", "假条"], "a": "请假流程帮你理一下：\n• 一节课：任课老师批准\n• 1天以内：班主任（辅导员）批准\n• 1天以上：学院批准\n• 2周以上：学工处批准\n• 1个月以上：分管校领导批准\n\n病假要医院证明，事假需家长知情。今日校园APP搜\"学生请假\"可线上申请。紧急情况先打我电话18070177202，后补手续。假满及时销假，逾期按旷课算。"}, {"k": ["病假", "生病请假"], "a": "病假材料：必须医院证明。\n• 1天以内：校医院诊断即可\n• 1天以上：二级以上医院诊断\n• 2周以上：二甲以上医院证明\n• 1个月以上：考虑办休学\n\n传染病需按学校要求隔离治疗。流程：线上提交申请+上传证明照片→逐级审批。病假期间自己找同学补笔记、补作业，假满及时销假。"}, {"k": ["旷课"], "a": "旷课处理阶梯（一学期累计）：10-15节警告→16-20节严重警告→21-30节记过→31-49节留校察看→50节以上按自动退学。迟到早退3次算旷课1节。千万别旷课，有事提前请假，我帮你协调。"}, {"k": ["处分种类", "警告处分", "处分期限", "违纪"], "a": "处分由轻到重：警告、严重警告、记过、留校察看、开除学籍。\n期限：警告6个月、严重警告8个月、记过9个月、留校察看12个月。\n影响：处分期内取消奖助评优资格、不能担任学生干部；期满审核解除后不再受影响。\n\n受到处分别慌，处分期内好好表现，到期可申请解除。有情况先来A305找我。"}, {"k": ["作弊", "考试违纪"], "a": "考试作弊后果很严重：作弊记过以上，情节严重开除学籍；替考、组织作弊、用通讯工具作弊直接开除学籍；作弊课程成绩无效，表现好可申请补考或重修。诚信考试，别抱侥幸心理！"}, {"k": ["申诉", "复议", "不服处分"], "a": "对处分或退学决定不服可以申诉：\n1. 接到决定书10个工作日内向校学生申诉处理委员会书面申诉\n2. 15日内复查（复杂可延15日）\n3. 对复查不服，15个工作日内向江西省教育厅申诉\n\n申诉期间原决定不执行不停止。需要我帮你准备材料，先来A305。"}, {"k": ["学生证", "补办学生证", "挂失", "火车优惠", "优惠卡"], "a": "学生证补办：\n• 流程：填《学生证补办申请表》→辅导员签名→学院盖章→学工处办理（今日校园可在线申请）\n• 在校期间最多补办或更换2次\n• 损坏换证交旧证+工本费\n• 火车优惠卡新生入校后统一发放，乘车区间填父母户籍地最近车站\n\n丢了及时挂失防冒用，直接来找我办。"}, {"k": ["晚自习", "晚自修"], "a": "明德书院晚自习：\n• 周日18:40-19:30、19:40-20:30\n• 周一至周四19:40-20:30\n\n咱班地点：\n• 23级五年制小教1班：周日第二节B204\n• 23级五年制小教2班：周日第二节B202\n• 26级学前本科2班：周日第二节B302\n• 26级音乐表演班：周日第二节B303，周一至周四B303\n\n按时到场，有事提前请假，具体以书院晚自习表为准。"}, {"k": ["晚归", "夜不归宿", "几点关门", "熄灯"], "a": "宿舍管理：\n• 周日至周四22:30关门（教室22:00），周五周六23:00\n• 寝室23:00熄灯\n• 晚归要登记，多次晚归通报批评；夜不归宿属违纪，警告以上并通知家长\n• 上课/午休/22:30后不会客\n\n实习、比赛等特殊晚归要提前请假报备。安全第一，有情况提前跟我说。"}, {"k": ["换宿舍", "调宿舍", "换寝室"], "a": "换宿舍条件：身体原因（需证明）、宿舍矛盾调解无效、其他特殊原因。\n时间：一般开学后2周内，期中原则上不办。\n流程：书面申请说明原因→辅导员核实→学院学工办审核→后勤宿舍管理中心调配。\n\n不允许私自换，违者按违纪处理。室友矛盾建议先沟通，沟通不了来A305我帮你们调解。"}, {"k": ["宿舍电器", "用电安全", "吹风机", "热得快", "电热毯", "违禁", "跳闸"], "a": "宿舍用电红线：\n🚫 大功率：电炉、电热锅、电煮锅、电磁炉、微波炉、电热水器、电热毯、暖风机、小太阳、热得快、电熨斗、大功率卷发棒\n✅ 可用：手机充电器、电脑、台灯（≤40W）、小功率风扇\n\n禁止私拉电线、插线板不上床、明火蜡烛、吸烟。每月1-2次安全检查，违禁电器第一次没收通报，第二次警告+通知家长。违章用电跳闸须到学工处处理。安全是大事，有需求先来找我，别自己硬来。"}, {"k": ["会客", "寝室规定", "宿舍规定"], "a": "宿舍管理要点：按指定床位入住，调换要找宿管中心申请；上课/午休/22:30后不会客，23:00熄灯；卫生每天轮值打扫，纳入评优评先和文明寝室评比；禁止养宠物、酗酒赌博、高空抛物。室友有摩擦先来A305找我调解。"}, {"k": ["军训", "免训", "拉练"], "a": "2026级军训：9月11日-24日，共14天，地点田径场等。\n内容：队列内务、模拟射击（实弹择优250人）、格斗救护、15公里拉练（9月19日）。\n\n免训/缓训：生理缺陷或疾病不能参训的，军训前书面申请+校医务部门确认。军训期间病假逐级书面审批；事假要军训办批准。原则上\"轻伤不下火线\"。\n\n军训是必修课占2学分。特殊情况尽早来A305办手续。"}, {"k": ["报修", "维修", "水电", "灯坏", "漏水", "空调坏", "下水道", "热水", "直饮水"], "a": "报修首选线上：今日校园APP搜\"后勤报修\"→右下角加号发起，水电、空调、太阳能热水、建筑、家具都能报，可查进度和评价，2个工作日内维修。\n\n紧急电话：\n• 水电（晚值班）：单号 廖老师13970167155/夏老师13970177897；双号 程老师13970181707/周老师13767611515\n• 综合维修（门窗床具）：吴老师15007018903\n• 太阳能热水：张师傅17370169188\n• 直饮水：廖师傅13970167155、程师傅13970181707\n• 空调：18970936363，美的客服4008899315\n\n⚠️ 违章用电跳闸须到学工处处理。"}, {"k": ["校园卡", "一卡通", "卡丢了", "补卡", "挂失", "完美校园"], "a": "校园卡功能：食堂消费、校医院缴费、宿舍购电、图书馆借书、体育签到。\n• 激活：扫卡上二维码或下载\"完美校园\"APP绑定\n• 初始密码：身份证后6位（X视为0），查询/消费密码独立，尽快修改\n• 充值：完美校园APP微信充值，到POS机刷一下领款\n• 每日消费限额50元，超额输密码\n\n丢了：①完美校园APP立即挂失 ②带身份证到校园卡服务中心补办（网络信息中心611室，图书馆侧门进，吴老师18270125230）③补卡后原卡余额24小时后转入。"}, {"k": ["医保", "报销"], "a": "大学生医保：每年9-10月统一参保，年度为9月1日至次年8月31日。门诊首诊校医院；住院定点医院直接刷卡结算；急诊保留发票病历可报，非急诊需先在校医院转诊。校医务室24小时热线19307010896。具体政策问校医院。"}, {"k": ["校医院", "发烧", "生病了", "看病"], "a": "校医务室24小时热线：19307010896，全天有医护值班。\n发烧处理：先测体温记录变化；低烧（37.3-38℃）多喝水休息，可去校医院；高烧38.5℃以上立即就医；伴咳嗽呼吸困难及时报告我。\n就诊带校园卡+身份证，保留病历发票用于医保报销，传染病按学校要求隔离。"}, {"k": ["在读证明", "成绩单", "英文成绩"], "a": "在读证明、成绩单到教务处办公室办理，也可以先来A305找我协助。中文成绩单教务处开；英文成绩单需申请，1-3个工作日。用于签证留学的证明建议提前办，盖章以教务处公章为准。"}, {"k": ["校园网", "wifi", "连网", "上网", "路由器"], "a": "校园网实名认证上网，浏览器弹出认证页登录：\n• 账号：学号\n• 初始密码：身份证后六位@jxsz（X区分大小写）\n\n路由器的坑：装了路由要关DHCP、网线从WAN口改接LAN口，否则多人共用账号上网不稳。\n故障报修：图书馆六楼网络信息中心602室，电话0701-6461665，裴老师18507010302、董老师18870892275。工作日可把路由器拿去602帮忙配置。"}, {"k": ["学平险", "保险", "怎么买"], "a": "学平险自愿参保，不强制、不指定产品：\n• 官方渠道：支付宝搜\"赣服通\"→学平险专区（省级唯一官方平台）\n• 保障期：当年9月1日至次年8月31日\n• 流程：赣服通→学平险→立即投保→选公司（推荐鹰潭本地设点的：国寿、人保、大地等）→选方案→填信息→缴费\n• 保障：意外伤害、意外医疗、重疾、住院医疗等\n\n⚠️ 别扫来路不明的二维码投保！投保地一定选\"鹰潭\"（就学地），选异地理赔会受阻。家庭抗风险弱的同学建议参保。"}, {"k": ["电动车", "电瓶车", "进校"], "a": "电动车进校要求：\n• 必须符合新国标（GB17761-2018）\n• 必须有鹰潭市正式红牌\n• 还要向保卫处申领\"校园通行牌\"\n• 无牌/临牌车禁止骑行和停放，滞留校内的按无主车清理\n\n以旧换新：不符合国标的旧车可享补贴（补贴+残值300-600元，最多抵800-1200元），云闪付APP→江西以旧换新平台→电动车专区申请。\n咨询：保卫处07016465110（办公楼1楼110室）。骑车戴头盔，不超速不逆行。"}, {"k": ["入党", "党员", "入党流程"], "a": "入党一般需2-3年，流程：\n1. 满18岁即可递交入党申请书\n2. 满3个月后经推优确定为入党积极分子\n3. 培养考察至少1年+党课合格\n4. 确定为发展对象→支部讨论\n5. 批为预备党员（预备期1年）→入党宣誓\n6. 转正\n\n要求成绩优良、无违纪、群众基础好。想入党的先来找我聊，帮你规划时间和材料。"}, {"k": ["团费"], "a": "学生团员每月0.2元，线上经智慧团建或共青团中央公众号缴，或交团支书统一上缴。连续6个月不交视为自动脱团。家庭困难可申请免交。"}, {"k": ["团组织关系", "转团", "团员转接", "智慧团建"], "a": "新生团组织关系入学后1个月内转完：\n• 线上：智慧团建系统（zhtj.youth.cn）申请转入对应团支部\n• 线下：带团员证+组织关系介绍信\n• 转入：江西师专音乐舞蹈学院（明德书院）XX级XX专业团支部\n\n团员证丢了可在大学补办（需入团志愿书）；账号问题找团支书或学院团总支。不转接影响入党评优毕业，务必按时完成！团组织咨询：吴老师17870737580。"}, {"k": ["青年大学习"], "a": "青年大学习全体团员每周一期，周一更新周日截止，江西共青团公众号→青年大学习。影响团支部考核和个人评优评先，多次不完成会被谈话。每期5-10分钟，建议周一就完成，忘了找团支书提醒。"}, {"k": ["素养积分", "综合素质", "综测"], "a": "书院综合素养积分7大模块：\n1. 主题微课程（上限5分，必修）\n2. 学风建设（基础20分，扣分制：旷课集体活动-2/次，处分-5至-10）\n3. 理想信念（15分：思想引领2/次、青年大学习0.1/次、党员最高+6）\n4. 品德修养（15分：活动2/次、学生干部最高+5、公益2/次）\n5. 文化素养（10分：比赛院2→国10）\n6. 强身健体（15分：锻炼0.2/次、体育比赛最高国10）\n7. 劳动实践（20分：志愿2/次、文明寝室最高+5、竞赛获奖最高国15）\n\n有必修项和合格线，均衡发展别偏科，认定由书院负责。"}, {"k": ["第二课堂", "到梦空间"], "a": "第二课堂是毕业必需学分：思想品德、学术科技、文化艺术、创新创业、社会实践五大类都有最低要求，不能只修一类。通过到梦空间APP报名活动签到，结束后自动发学分。建议大一大二多参加，音舞学院的文艺演出活动很有优势，毕业前不够会卡毕业！"}, {"k": ["实习", "教育见习", "见习"], "a": "实习两种形式：\n1. 学院统一安排（一般大三）：学前教育专升本是第3学期前9周教育实习，合作幼儿园、中小学、文艺团体等，有老师跟进\n2. 自主实习：自己联系单位，需提交申请+单位资质证明+家长同意书，须与专业相关\n\n要求：时长达标、交实习日志报告鉴定表，实习成绩计入学分，不及格不能毕业。音舞学院实习基地名单来A305问。"}, {"k": ["三方协议", "就业协议"], "a": "三方协议明确毕业生、单位、学校三方权责：\n• 从辅导员处领取，一人一号\n• 与单位协商填写→单位盖章→你签字→学院盖章→就业指导中心盖章→三方各执一份\n\n注意：三方≠劳动合同，入职还要签劳动合同；违约要担责（可能有违约金）；签后考上公务员/专升本可按约定解约。签之前想清楚，拿不准拿来A305我帮你看。"}, {"k": ["毕业去向", "去向登记", "ncss"], "a": "毕业生必须在全国毕业去向登记系统登记：\n• 网址：https://wq.ncss.cn/（学信网账号或微信扫码登录）\n• 选\"毕业去向填报\"按实际情况选类别：\n  - 劳动合同/就业协议→上传合同\n  - 其他录用证明→需3个月流水\n  - 自由职业→手写承诺书+收入流水\n  - 专升本→上传录取截图\n  - 入伍→入伍通知书\n  - 创业→营业执照\n• 公司名称一定写全称（系统会核验）\n\n所有人都要登记，信息真实。有疑问来A305。"}, {"k": ["专升本", "升本", "考本科"], "a": "专升本备考指南：\n• 条件：应届专科毕业生、无违纪、能正常毕业\n• 科目：英语必考+政治/高数（按专业类别）+专业基础课\n• 时间：一般3月报名、4月考试\n• 院校：省内招专升本的本科院校（江西师大、科技师大、南航大等，以当年计划为准）\n• 咱院可报：音乐学、舞蹈学、学前教育、小教、艺术设计等\n\n只有一次机会（退役士兵除外），大二开始准备英语，关注江西省教育考试院官网。学校有辅导班，需要来A305问我。"}, {"k": ["教师资格证", "教资"], "a": "教资报考：大专及以上学历（专科大三可报），户籍或人事关系在江西。\n• 笔试每年3月、11月；面试每年5月、次年1月\n• 报名：ntce.neea.edu.cn\n• 科目：幼儿园考2科、小学2科、中学3科\n• 笔试单科成绩有效期2年\n• 面试通过后需认定（要普通话证，一般二乙，语文二甲）\n\n音舞学院学生可报音乐、舞蹈、学前等方向，尽早规划。"}, {"k": ["心理咨询", "心理预约", "心理中心", "压力大", "睡不着", "心情差", "焦虑", "难过"], "a": "听到你这么说我很关心你，最近遇到什么了吗？可以跟我聊聊。\n\n给你几个建议：\n1. 学校心理发展中心免费咨询：电话0701-6460367；0701-6262525，或到一站式社区四楼（西边）现场预约。值班：夏季18:40-21:10，冬季18:20-20:50，周末9:00-11:30\n2. 睡不着试试睡前放下手机、听轻音乐、深呼吸\n3. 多跟信任的人聊，别一个人扛\n4. 持续两周以上或影响学习生活，一定要来A305找我或去心理中心\n\n你不是一个人，随时找我 💛"}, {"k": ["我们学院", "专业有哪些", "音乐舞蹈学院", "学院专业"], "a": "音乐舞蹈学院（明德书院）现有7个专业：\n• 音乐表演、音乐教育、舞蹈表演\n• 学前教育（含本科、中外合作）\n• 小学教育、小学英语教育、小学语文教育\n\n培养方案在教务系统可查，或来A305详细问我。"}, {"k": ["学院活动", "特色活动", "文艺活动"], "a": "学院特色活动：迎新晚会/毕业汇报演出、校园歌手大赛、舞蹈大赛、艺术实践周、文艺下乡志愿演出；学前/小教专业有见习、试讲、教具制作比赛；明德书院有书院文化节、寝室文化节。时间和报名方式看学院公众号和班级群，记得关注哦。"}, {"k": ["琴房", "实训室", "排练厅", "练习"], "a": "琴房/实训室使用：\n• 场地：琴房、舞蹈排练厅、声乐教室、器乐排练室、多功能厅\n• 课程使用由任课老师安排；课后练习经琴房管理系统预约或现场登记；社团排练需申请经学院审批\n• 时间一般8:00-21:30\n• 规定：爱护设备、不带食物饮料、不超时占用、损坏照价赔偿\n\n资源紧张，预约后按时到，爽约影响信用。"}, {"k": ["带哪些班", "负责哪些班", "你是哪个班", "你的班级"], "a": "我目前带4个班：\n1. 23级五年制小学教育1班（36人）\n2. 23级五年制小学教育2班（33人）\n3. 26级学前教育本科2班（60人）\n4. 26级音乐表演班（30人）\n\n是这几个班的同学有事直接找我：一站式A305，电话18070177202。"}, {"k": ["课表", "课程安排", "有什么课", "这学期课"], "a": "完整课表在教务系统（电脑端正方教务系统→信息查询→学生课表查询）或班级群查看。简单说说：\n• 23级五年制小教1/2班：写作、中国文学、古代汉语、小语/小数/小英教学设计、班级管理、现代教育技术等\n• 26级学前本科2班：马原、乐理视唱、幼儿园课程、教育学原理、琴法、幼儿舞蹈创编、保育学、普通心理学、大学英语等\n• 26级音乐表演班：思修、大学英语、钢琴、声乐、器乐、视唱练耳与乐理等\n\n调课会提前通知，以教务系统为准。"}, {"k": ["你是ai", "你是机器人", "人工智能", "真人", "真人老师"], "a": "我是吴佩文老师的AI助手，可以帮你解答常见的学生事务问题。复杂情况或需要本人处理的，会转给吴老师。也可以直接加吴老师微信wpw19930530，或打电话18070177202。"}, {"k": ["同学的成绩", "别人的成绩", "透露隐私", "别人的处分", "他人信息"], "a": "其他同学的个人信息、成绩、处分情况属于隐私，我不能透露哦 🙅 想了解自己的情况可以随时问我，或者本人来A305查询。"}, {"k": ["课程", "作业", "考试内容", "论文怎么写", "教学安排", "任课老师", "教材", "数学题"], "a": "教学内容和课程问题我答不专业，别让我误导你 😄 课程疑问直接问任课老师，教学安排、选课、学分认定找教务办。生活上的事随时来找我～"}, {"k": ["谢谢", "感谢", "辛苦了"], "a": "不客气，这是我应该做的 😊 有问题随时找我，或直接来A305～"}, {"k": ["再见", "拜拜", "bye", "晚安"], "a": "好，有事随时联系，注意休息～晚安 🌙"}];

// ===== 兜底 =====
const FALLBACK = ["这个问题我需要确认一下最新信息，你可以直接私信我，或者来一站式服务大厅A305办公室找我当面聊。也可以拨打我的电话18070177202。", "这个我怕说错了误导你，我先去确认下最新政策 📋 你可以私信我，或来一站式A305当面问，这样最稳妥。"];

const chat = document.getElementById('chat');
const input = document.getElementById('input');
const chipsBox = document.getElementById('chips');
let fallbackIdx = 0;

const CHIPS = ["请假流程是什么？","国家助学金怎么申请？","宿舍水电坏了怎么报修？","学平险怎么买？"];
CHIPS.forEach(c => {
  const d = document.createElement('div');
  d.className = 'chip'; d.textContent = c;
  d.onclick = () => { input.value = c; send(); };
  chipsBox.appendChild(d);
});

function addMsg(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.innerHTML = `<div class="mini">${who==='bot'?'👩‍🏫':'🙂'}</div><div class="bub"></div>`;
  div.querySelector('.bub').textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

const REF_NOTE = "（以上信息供参考，如有变动以学院最新通知为准）";

function botReply(userText) {
  const typing = addMsg('', 'bot');
  typing.querySelector('.bub').classList.add('typing');
  typing.querySelector('.bub').innerHTML = '<i></i><i></i><i></i>';
  setTimeout(() => {
    const q = userText.toLowerCase();
    let ans = null, isCrisis = false;
    const layers = [CRISIS, SAD, TRANSFER, KNOWLEDGE];
    outer:
    for (const layer of layers) {
      for (const item of layer) {
        if (item.k.some(k => q.includes(k))) { ans = item.a; isCrisis = (layer === CRISIS); break outer; }
      }
    }
    if (ans && !isCrisis) {
      const src = KNOWLEDGE.find(it => it.a === ans);
      if (src && !ans.includes("供参考")) ans += "\n\n" + REF_NOTE;
    }
    if (!ans) { ans = FALLBACK[fallbackIdx++ % FALLBACK.length]; }
    const bub = typing.querySelector('.bub');
    bub.innerHTML = '';
    if (isCrisis) { typing.classList.add('crisis'); }
    let i = 0;
    const timer = setInterval(() => {
      bub.textContent = ans.slice(0, ++i);
      chat.scrollTop = chat.scrollHeight;
      if (i >= ans.length) clearInterval(timer);
    }, 11);
  }, 400 + Math.random()*500);
}

function send() {
  const t = input.value.trim();
  if (!t) return;
  addMsg(t, 'user');
  input.value = '';
  botReply(t);
}

document.getElementById('send').onclick = send;
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

}, 400);
